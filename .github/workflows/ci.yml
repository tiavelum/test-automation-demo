name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer commit of the same pull request cancels the run of the older one (TL-34); a push
# to main gets a group of its own and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.18"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

  api-tests:
    runs-on: ubuntu-24.04
    env:
      BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.18"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # --wait returns once the health check of compose.yaml passes, and fails if it never does.
      - name: Build and start the service
        run: docker compose up --build --detach --wait

      - name: Run the API tests
        run: pytest -v --junitxml=test-results/api-tests.xml

      - name: Save the service log
        if: ${{ !cancelled() }}
        run: mkdir -p test-results && docker compose logs --no-color > test-results/service.log

      - name: Keep the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-test-report
          path: test-results/

      - name: Stop the service
        if: ${{ always() }}
        run: docker compose down
